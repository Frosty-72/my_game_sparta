<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в игру Спартак</title>
    <link rel="stylesheet" href="enter.css">
</head>
<body>
    <div class="container">
        <h1>Вход в игру Спартак</h1>
        <form id="loginForm">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Введите ваш email" required>
            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" placeholder="Введите пароль" minlength="4" maxlength="16" required>
            <button type="submit">Войти</button>
        </form>
        <p class="forgot-password">
            <a href="#">Забыли пароль?</a>
        </p>
        <button id="logoutButton" class="logout-button">Выйти</button>
        <p id="message"></p>
    </div>
    <script src="enter.js"></script>
</body>
</html>
