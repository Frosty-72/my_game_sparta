<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спартак - Добро пожаловать!</title>
    <link rel="stylesheet" href="styles.css"> <!-- Подключаем файл стилей -->
</head>
<body>
    <div class="container">
        <!-- Заголовок страницы -->
        <h1>Добро пожаловать в игру Спартак!</h1>
        
        <!-- Изображение игры -->
        <img src="image/при входе.jpg" alt="Изображение игры Спартак" class="game-image">
        
        <!-- Описание игры -->
        <p class="description">
            Спартак - это захватывающая игра, где вы сможете почувствовать себя настоящим воином. 
            Сражайтесь с врагами, развивайте свои навыки и станьте легендой! 
            Присоединяйтесь к нам и начните свое эпическое приключение уже сегодня!
        </p>
        
        <!-- Кнопки для входа и регистрации -->
        <div class="buttons">
            <button onclick="login()">Войти</button>
            <button onclick="register()">Зарегистрироваться</button>
        </div>
    </div>

    <script src="script.js"></script> <!-- Подключаем файл JavaScript -->
</body>
</html>
